[package]
name = "povray-harness"
version = "0.1.0"
edition = "2021"
description = "wasmi-based diagnostic harness for pkg/povray.wasm"

[[bin]]
name = "povray-harness"
path = "src/main.rs"

[dependencies]
# Same interpreter Typst uses — reproduces its runtime behavior exactly.
# 1.0.x is the first release with SIMD + relaxed-SIMD support, gated
# behind the "simd" feature. Our wasm is built with -msimd128, so we
# must enable SIMD here or wasmi rejects the module at parse time.
wasmi = { version = "0.51", features = ["simd"] }

[profile.release]
lto = true
codegen-units = 1
